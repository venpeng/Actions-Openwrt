name: OpenWrt Builder For XG 040G MD

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/pbs05/ponwrt.git
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config/xg040gmd/.config
  DIY_P1_SH: diysh/xg040gmd/diy-part1.sh
  DIY_P2_SH: diysh/xg040gmd/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # Checkout 当前工作流仓库
      - name: Checkout
        uses: actions/checkout@v4

      # 初始化编译环境
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 注意：不要删除 /etc/apt/sources.list.d/*
          # Ubuntu 24.04 默认软件源配置可能就在 ubuntu.sources 中

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo docker image prune --all --force

          sudo apt-get update

          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev \
            libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils python3-pyelftools qemu-utils re2c rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev zstd

          sudo apt-get autoremove --purge -y
          sudo apt-get clean

          sudo timedatectl set-timezone "$TZ"

          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

          echo "========== Installed tool versions =========="
          gcc --version
          make --version
          cmake --version
          go version

      # 下载 PonWrt 源码
      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT "$PWD"

          git clone --depth=1 "$REPO_URL" \
            -b "$REPO_BRANCH" openwrt

          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      # 加载自定义 feeds
      - name: Load custom feeds
        run: |
          if [ -e "$FEEDS_CONF" ]; then
            mv "$FEEDS_CONF" openwrt/feeds.conf.default
          fi

          chmod +x "$DIY_P1_SH"

          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      # 更新 feeds
      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      # 安装 feeds
      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      # 加载自定义配置
      - name: Load custom configuration
        run: |
          if [ -e files ]; then
            mv files openwrt/files
          fi

          if [ -e "$CONFIG_FILE" ]; then
            mv "$CONFIG_FILE" openwrt/.config
          else
            echo "ERROR: Config file not found: $CONFIG_FILE"
            exit 1
          fi

          chmod +x "$DIY_P2_SH"

          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      # 检查配置并下载依赖源码
      - name: Download package
        id: package
        run: |
          cd openwrt

          make defconfig
          make download -j8

          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # 编译固件
      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt

          echo "========== Build environment =========="
          go version
          gcc --version
          nproc
          df -hT

          echo "$(nproc) threads compiling"

          make -j"$(nproc)" || \
            make -j1 || \
            make -j1 V=s

          echo "status=success" >> "$GITHUB_OUTPUT"

          grep '^CONFIG_TARGET_.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME

          if [ -s DEVICE_NAME ]; then
            echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          fi

          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      # 检查磁盘空间
      - name: Check space usage
        if: always()
        run: |
          df -hT

      # 上传完整 bin 目录（可选）
      - name: Upload bin directory
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      # 整理固件文件
      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*

          rm -rf packages

          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      # 上传固件 Artifact
      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      # 生成 Release 标签
      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d_%H%M")${{ env.DEVICE_NAME }}" \
            >> "$GITHUB_OUTPUT"

          touch release.txt

          echo "status=success" >> "$GITHUB_OUTPUT"

      # 发布固件到 GitHub Release
      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      # 删除旧工作流记录
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 2

      # 删除旧 Releases
      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 20
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}