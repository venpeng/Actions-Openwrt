# =============================================================
# Build ImmortalWrt ACRH17
#
# 本分支只编 ACRH17（asus_rt-ac42u，ipq40xx/generic）一台机器。
# 原来 main 上是两个 workflow，差别只有 LAN 网段（1.1 / 11.1），
# 现在合并成一个，网段放下拉框选。
#
# 与 acrh17 分支的唯一区别：**代理内核从 homeproxy 换成 helloworld**。
#   - helloworld feed 钉在 f92f566（xray-core 25.1.1）
#     24.10 的 golang 是 1.23.12，xray 从 25.3.31 起要 go 1.24，编不过
#   - 换掉 homeproxy 是因为 256MB 内存跑 sing-box 吃力
#   - MosDNS 显式关掉（第二个常驻 Go 进程），分流用 chinadns-ng
#
# 下拉：
#   lan_ip          1.1  = 192.168.1.1（固件默认，等同于不改）
#                   11.1 = 192.168.11.1
#                   all  = 两个网段各编一份（matrix 展开成两个并行 job）
#   hw_version      helloworld 版本（决定 xray 内核）
#                   25.1.1   = f92f566（2025-03-30，默认）
#                   24.12.31 = 5eeaf1c（2025-01-10）
#                   两个都能在 24.10 上编，Go 1.23.12 够用
#   extra_plugins   true = config/extra-packages.config 里的插件全部编进去
#                   false = 那些插件全部置为 not set
#   upload_release  是否发 Release
#
# 配置结构（.config 不再是一份死文件，而是每次现拼）：
#   config/base/immortalwrt-24.10.config   基础配置（不含机型符号、不含额外插件）
#   config/extra-packages.config           额外插件清单
#   scripts/ci/gen-config.sh               基础配置 + 机型 + 插件 → openwrt/.config
#   scripts/ci/verify-config.sh            defconfig 后校验机型/插件/helloworld 版本
#   diysh/acrh17/diy-part1.sh              feeds 更新前（加 helloworld feed 并钉提交）
#   diysh/acrh17/diy-part2.sh              feeds 更新后，按 LAN_IP 改网关与 ssid
#
# 注意：基础配置里 CONFIG_TARGET_PREINIT_IP 仍是 192.168.1.1，
#       那是镜像预初始化阶段的地址，只在首启未配置时短暂生效，
#       选 11.1 也不影响正常使用，所以不动它。
# =============================================================

name: Build ImmortalWrt ACRH17

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: 'LAN 网段：1.1 / 11.1 各编一份；all = 两个一起编（并行两个 job）'
        required: true
        default: '1.1'
        type: choice
        options:
          - '1.1'
          - '11.1'
          - all
      hw_version:
        description: 'helloworld 版本（xray 内核）：25.1.1 = 2025-03-30 版；24.12.31 = 2025-01-10 版'
        required: true
        default: '25.1.1'
        type: choice
        options:
          - '25.1.1'
          - '24.12.31'
      extra_plugins:
        description: '编译额外插件（清单：config/extra-packages.config）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      upload_release:
        description: '固件发布到 Release（false 则只上传 Artifact）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_BASE: config/base/immortalwrt-24.10.config
  DIY_P1_SH: diysh/acrh17/diy-part1.sh
  DIY_P2_SH: diysh/acrh17/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  EXTRA_PLUGINS: ${{ inputs.extra_plugins || 'true' }}
  # helloworld 版本 → 具体提交的映射在 diy-part1.sh 里，这里只传版本号
  HW_VERSION: ${{ inputs.hw_version || '25.1.1' }}
  UPLOAD_RELEASE: ${{ inputs.upload_release || 'true' }}
  TZ: Asia/Shanghai
  # LAN_IP 不在这里：它由下面 jobs.build.strategy.matrix 展开，见 jobs.build.env

jobs:
  build:
    runs-on: ubuntu-22.04

    # lan_ip = all 时展开成两个 job 并行（1.1 / 11.1 各一份固件）。
    # 为什么不用「一个 job 编两轮」：网关地址写在 base-files 的 config_generate 里，
    # 改完必须重做 rootfs 才会进固件，靠 make 增量重编依赖不好掌控（files/ 目录
    # 的 mtime 不一定变），编出来的第二份固件有可能还是旧地址。两个 job 各走一遍
    # 完整流程，行为和单独编一个网段完全一致，也不怕互相污染。
    # fail-fast: false —— 一个网段失败不该把另一个也取消掉。
    strategy:
      fail-fast: false
      matrix:
        # all → ["1.1","11.1"]；单个 → ["1.1"] 或 ["11.1"]
        # repository_dispatch 触发时没有 inputs，|| 兜底成 1.1
        lan_ip: ${{ fromJSON(inputs.lan_ip == 'all' && '["1.1","11.1"]' || format('["{0}"]', inputs.lan_ip || '1.1')) }}
    env:
      LAN_IP: ${{ matrix.lan_ip }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt -qq update
          sudo -E apt -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt -qq autoremove --purge
          sudo -E apt -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "COMMIT=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "上游提交: $(git -C openwrt rev-parse HEAD)"

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

          # helloworld 是本分支的代理内核来源，没拉下来就早点停，
          # 省得 defconfig 把 ssr-plus 静默丢掉、编完才发现没代理。
          if [ ! -d feeds/helloworld ]; then
            echo "::error::feeds/helloworld 不存在 —— diy-part1.sh 的 feed 没加上？"
            exit 1
          fi
          XRAY_VER=$(grep -m1 '^PKG_VERSION:=' feeds/helloworld/xray-core/Makefile | sed 's/.*:=//')
          echo "helloworld xray-core: ${XRAY_VER}（期望 ${HW_VERSION}）"
          echo "helloworld 提交: $(git -C feeds/helloworld log -1 --date=short --format='%h %ad %s')"
          if [ "$XRAY_VER" != "$HW_VERSION" ]; then
            echo "::warning::xray 是 ${XRAY_VER}，和下拉选的 ${HW_VERSION} 不一致 —— 检查 diy-part1.sh 的版本映射"
          fi

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      # ---------------------------------------------------------------
      # 生成 .config：基础配置 + 机型符号 + 额外插件开关
      # ---------------------------------------------------------------
      - name: Generate .config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/ci/gen-config.sh" \
            "$PWD" \
            "$GITHUB_WORKSPACE/$CONFIG_BASE" \
            "$EXTRA_PLUGINS"

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          chmod +x $DIY_P2_SH
          cd openwrt
          # LAN_IP 由 job env（matrix 展开）传入，脚本里读它改网关
          LAN_IP="$LAN_IP" $GITHUB_WORKSPACE/$DIY_P2_SH

      # 唯一一次 defconfig：之后不再调用，避免写死的配置被重新展开剔除
      - name: Defconfig & verify
        run: |
          cd openwrt
          # 不能 `make defconfig | tail`：退出码取的是 tail 的，失败会被吞掉
          make defconfig
          bash "$GITHUB_WORKSPACE/scripts/ci/verify-config.sh" "$PWD" "$EXTRA_PLUGINS"

      - name: Download package
        id: package
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}_${{ env.LAN_IP }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages

          # 展开后的 .config：defconfig 之后、真正驱动本次编译的那份。
          # bin/targets 里本来也有 config.buildinfo，但那个名字认不出是哪个
          # 网段编的（all 时同一次提交有两份固件），所以单独改名存一份。
          CFG_NAME="config-immortalwrt-24.10-${LAN_IP}-$(date +%Y%m%d).config"
          cp -f "$GITHUB_WORKSPACE/openwrt/.config" "$CFG_NAME"
          echo "已附带配置: $CFG_NAME（$(wc -l < "$CFG_NAME") 行）"

          {
            echo "源码      : immortalwrt (${REPO_URL})"
            echo "分支      : ${REPO_BRANCH}"
            echo "提交      : ${COMMIT}"
            echo "机型      : asus_rt-ac42u"
            echo "代理内核  : helloworld xray ${HW_VERSION}（提交 ${HW_COMMIT:-?}）"
            echo "LAN 网段  : 192.168.${LAN_IP}"
            echo "额外插件  : ${EXTRA_PLUGINS}"
            echo "构建时间  : $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            echo "内核      : $(grep -m1 '^CONFIG_LINUX_' "$GITHUB_WORKSPACE/openwrt/.config" | sed 's/^CONFIG_LINUX_//; s/=y$//; s/_/./g')"
            echo "配置文件  : ${CFG_NAME}（= 本次实际使用的 .config）"
          } > build-info.txt

          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          echo "----- 产物 -----"
          ls -lh

      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}_${{ env.LAN_IP }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d_%H%M")${{ env.DEVICE_NAME }}_${{ env.LAN_IP }}" >> $GITHUB_OUTPUT
          touch release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@master
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 2

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 20
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
